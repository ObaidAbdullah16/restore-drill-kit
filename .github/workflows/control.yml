# One-click start / stop / drill from the Actions tab (or: gh workflow run control.yml -f action=up)
name: Control (start / stop)
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, up, drill, drill-pitr, down]
        default: status

permissions: {}

concurrency:
  group: aws-restore-drill-kit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check configuration
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "::error::AWS_ROLE_ARN is not set: start the AWS foundation on your laptop first (bash _setup/projects.sh up foundation)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - name: Is this repository connected to AWS?
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "::error::Not connected to AWS (no AWS_ROLE_ARN variable). AWS accounts from the new AWS sign-up cannot let GitHub log in - run it from your laptop instead: bash _setup/projects.sh up restore-drill (or down)"
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: restore-drill-control
      - run: pip install -e .
      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: |
          case "$ACTION" in
            up)         bash scripts/up.sh ;;
            drill)      bash scripts/drill.sh ;;
            drill-pitr) MODE=pitr bash scripts/drill.sh ;;
            down)       bash scripts/down.sh ;;
            *)          bash scripts/status.sh ;;
          esac
      - name: Report to summary
        if: always() && startsWith(inputs.action, 'drill')
        run: cat reports/rds-*/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && startsWith(inputs.action, 'drill')
        with:
          name: rds-drill-report
          path: reports/
          if-no-files-found: ignore
