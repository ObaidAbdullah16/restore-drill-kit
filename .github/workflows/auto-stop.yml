# Safety net: every night at 00:00 IST, tear down anything left running.
# Turn off by setting the repository variable AUTO_STOP to "false".
name: Auto-stop (nightly)
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: aws-restore-drill-kit
  cancel-in-progress: false

jobs:
  stop:
    if: vars.AWS_ROLE_ARN != '' && vars.AUTO_STOP != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: restore-drill-autostop
      - run: pip install -e .
      - name: Down if up
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: bash scripts/down.sh
