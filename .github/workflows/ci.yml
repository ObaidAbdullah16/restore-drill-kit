name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-drill:
    name: Tests + a real restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      prod:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      sandbox:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PG_PROD_DSN: postgresql://postgres:postgres@localhost:5433/shop
      PG_SANDBOX_DSN: postgresql://postgres:postgres@localhost:5434/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
          pg_dump --version
      - run: pip install -e ".[dev]"
      - run: ruff check restoredrill tests
      - run: pytest -q -p no:warnings
      - name: Restore drill (synthetic data, 5,000 customers)
        run: |
          restoredrill seed --dsn "$PG_PROD_DSN" --customers 5000
          restoredrill backup --dsn "$PG_PROD_DSN" --out backups
          restoredrill drill --backup backups --sandbox-dsn "$PG_SANDBOX_DSN" \
            --rto-target 5m --rpo-target 24h --report reports/ci
          cat reports/ci/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: drill-report
          path: reports/ci/

  iac-and-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - run: pip install checkov shellcheck-py actionlint-py
      - run: shellcheck -x -P SCRIPTDIR scripts/*.sh
      - run: terraform fmt -check -recursive infra
      - run: |
          terraform -chdir=infra/terraform init -backend=false -input=false >/dev/null
          terraform -chdir=infra/terraform validate
      - run: checkov -d infra/terraform --framework terraform --config-file .checkov.yaml --quiet --compact
      - run: actionlint
