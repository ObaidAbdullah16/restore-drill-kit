[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restore-drill-kit"
dynamic = ["version"]
description = "Prove that Postgres/RDS backups restore: timed drills with RTO/RPO reports and backup-isolation checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Obaid Abdullah" }]
dependencies = ["psycopg[binary]>=3.1", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[rds,ec2,s3,ssm,iam,backup]>=5.0"]

[project.scripts]
restoredrill = "restoredrill.cli:main"

[tool.setuptools]
packages = ["restoredrill"]

[tool.setuptools.dynamic]
version = { attr = "restoredrill.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
